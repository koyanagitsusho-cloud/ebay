version: "3.9"

# ─────────────────────────────────────────────────────────────────
# eBay自動化ツール Docker Compose設定（開発環境）
#
# 起動手順:
#   cp .env.example .env      # .envを編集してAPIキーを設定
#   docker-compose up -d
#   docker-compose exec backend alembic upgrade head
#   docker-compose exec backend python create_admin.py
# ─────────────────────────────────────────────────────────────────

services:
  # ─── PostgreSQL ───
  postgres:
    image: postgres:15-alpine
    container_name: ebay_postgres
    environment:
      POSTGRES_DB: ebay_automation
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ─── Redis ───
  redis:
    image: redis:7-alpine
    container_name: ebay_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ─── FastAPI バックエンド ───
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ebay_backend
    ports:
      - "8000:8000"
    environment:
      # DB・Redis 接続はサービス名（Docker内部DNS）を使う
      - DATABASE_URL=postgresql+asyncpg://postgres:password@postgres:5432/ebay_automation
      - REDIS_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      # フロントエンドのオリジン（ブラウザからのCORS許可）
      # localhost:3000 = ユーザーブラウザからのアクセス
      - CORS_ORIGINS=["http://localhost:3000","http://127.0.0.1:3000"]
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped

  # ─── Celery ワーカー ───
  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ebay_celery
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:password@postgres:5432/ebay_automation
      - REDIS_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=2
    restart: unless-stopped

  # ─── Next.js フロントエンド ───
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ebay_frontend
    ports:
      - "3000:3000"
    environment:
      # ブラウザ（ホスト側）から backend にアクセスするため localhost を使う
      # （コンテナ内からではなくブラウザのJSが送信するため）
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
