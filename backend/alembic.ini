[alembic]
script_location = alembic
prepend_sys_path = .
# 注意: この URL は alembic/env.py で os.environ から上書きされる。
# Docker Compose 環境: DATABASE_URL=postgresql+asyncpg://postgres:password@postgres:5432/ebay_automation
# ローカル環境:        DATABASE_URL=postgresql+asyncpg://postgres:password@localhost:5432/ebay_automation
sqlalchemy.url = postgresql+asyncpg://postgres:password@localhost:5432/ebay_automation

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
